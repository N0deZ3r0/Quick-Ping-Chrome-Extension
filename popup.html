<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="appName">Quick Ping</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <!-- Иконки лежат прямо здесь: расширение не должно ходить в сеть за оформлением. -->
    <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <symbol id="i-bolt" viewBox="0 0 24 24">
            <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="i-play" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7Z" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="i-spinner" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke-dasharray="40 17"/>
        </symbol>
        <symbol id="i-globe" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18"/>
            <path d="M12 3c2.4 2.5 3.7 5.6 3.7 9s-1.3 6.5-3.7 9c-2.4-2.5-3.7-5.6-3.7-9S9.6 5.5 12 3Z"/>
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5.3l3.4 2"/>
        </symbol>
        <symbol id="i-chart" viewBox="0 0 24 24">
            <path d="M4 4v16h16"/>
            <path d="M7.5 14.5 11 10l3 2.5L19.5 6"/>
        </symbol>
        <symbol id="i-history" viewBox="0 0 24 24">
            <path d="M3.6 13a8.5 8.5 0 1 0 2.2-6.4"/>
            <path d="M3 4.5V10h5.5"/>
            <path d="M12 8.5V12l2.8 1.8"/>
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
            <path d="M4 7h16"/>
            <path d="M9.5 7V5.2a1.2 1.2 0 0 1 1.2-1.2h2.6a1.2 1.2 0 0 1 1.2 1.2V7"/>
            <path d="m6.5 7 .9 12a2 2 0 0 0 2 1.9h5.2a2 2 0 0 0 2-1.9l.9-12"/>
            <path d="M10.5 11v6M13.5 11v6"/>
        </symbol>
        <symbol id="i-dot" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5.5" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="m8 12.4 2.6 2.6L16 9.6"/>
        </symbol>
        <symbol id="i-alert" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7.2v5.6"/>
            <circle cx="12" cy="16.4" r="1.1" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="i-info" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 11.2v5.6"/>
            <circle cx="12" cy="7.6" r="1.1" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="i-window" viewBox="0 0 24 24">
            <rect x="3" y="4.5" width="18" height="15" rx="2.5"/>
            <path d="M3 9h18"/>
            <circle cx="6.6" cy="6.8" r="0.9" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
            <rect x="9" y="9" width="11" height="11" rx="2.2"/>
            <path d="M15 6.2A2.2 2.2 0 0 0 12.8 4H6.2A2.2 2.2 0 0 0 4 6.2v6.6A2.2 2.2 0 0 0 6.2 15"/>
        </symbol>
        <symbol id="i-eye" viewBox="0 0 24 24">
            <path d="M2.5 12S6.2 5.5 12 5.5 21.5 12 21.5 12 17.8 18.5 12 18.5 2.5 12 2.5 12Z"/>
            <circle cx="12" cy="12" r="3.2"/>
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14"/>
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
            <path d="M6 6l12 12M18 6 6 18"/>
        </symbol>
    </svg>

    <div class="container">
        <div class="header">
            <svg class="icon icon-lg"><use href="#i-bolt"></use></svg>
            <h1 data-i18n="appName">Quick Ping</h1>
        </div>

        <div class="tabs" role="tablist">
            <button class="tab is-active" id="tabCheck" data-view="check" role="tab" data-i18n="tabCheck">Check</button>
            <button class="tab" id="tabWatch" data-view="watch" role="tab">
                <span data-i18n="tabWatch">Watch</span>
                <span class="tab-count" id="watchCount" hidden>0</span>
            </button>
        </div>

        <div class="main-content">
            <!-- Экран проверки -->
            <section class="view" id="viewCheck" role="tabpanel">
                <div class="card">
                    <div class="input-group">
                        <input type="text" id="urlInput" data-i18n-placeholder="urlPlaceholder"
                               autocomplete="off" spellcheck="false" autocapitalize="off">
                        <button id="pingBtn" class="btn-primary" data-i18n-title="pingButton" data-i18n-aria="pingButton">
                            <svg class="icon" id="pingBtnIcon"><use href="#i-play"></use></svg>
                        </button>
                    </div>

                    <div class="input-actions">
                        <button id="currentTabBtn" class="btn-ghost" data-i18n-title="currentTabHint">
                            <svg class="icon icon-sm"><use href="#i-window"></use></svg>
                            <span data-i18n="currentTab">This tab</span>
                        </button>
                        <label class="field">
                            <span data-i18n="samplesLabel">Samples</span>
                            <select id="samplesSelect" data-i18n-title="samplesHint"></select>
                        </label>
                    </div>

                    <div class="quick-buttons" id="pinList"></div>
                </div>

                <div id="currentResult" class="current-result card"></div>

                <div class="stats">
                    <div class="stat">
                        <div class="stat-icon">
                            <svg class="icon"><use href="#i-clock"></use></svg>
                        </div>
                        <div class="stat-info">
                            <div class="stat-label" data-i18n="statLast">Last</div>
                            <div id="lastPing" class="stat-value">-</div>
                        </div>
                    </div>
                    <div class="stat">
                        <div class="stat-icon">
                            <svg class="icon"><use href="#i-chart"></use></svg>
                        </div>
                        <div class="stat-info">
                            <div class="stat-label" data-i18n="statAverage">Average</div>
                            <div id="avgPing" class="stat-value">-</div>
                        </div>
                    </div>
                </div>

                <div class="card history-section">
                    <div class="section-header">
                        <h3>
                            <svg class="icon icon-sm"><use href="#i-history"></use></svg>
                            <span data-i18n="historyTitle">History</span>
                        </h3>
                        <div class="section-actions">
                            <button id="exportBtn" class="btn-icon" data-i18n-title="exportHistory" data-i18n-aria="exportHistory">
                                <svg class="icon icon-sm"><use href="#i-copy"></use></svg>
                            </button>
                            <button id="clearBtn" class="btn-clear" data-i18n-title="clearButton" data-i18n-aria="clearButton">
                                <svg class="icon icon-sm"><use href="#i-trash"></use></svg>
                                <span class="btn-clear-label" data-i18n="clearConfirm">Sure?</span>
                            </button>
                        </div>
                    </div>
                    <div id="historyList" class="history-list"></div>
                </div>
            </section>

            <!-- Экран наблюдения -->
            <section class="view" id="viewWatch" role="tabpanel" hidden>
                <div class="card">
                    <p class="hint" data-i18n="watchHint"></p>
                    <div class="input-group">
                        <input type="text" id="watchInput" data-i18n-placeholder="urlPlaceholder"
                               autocomplete="off" spellcheck="false" autocapitalize="off">
                        <select id="watchInterval" data-i18n-title="watchIntervalHint"></select>
                        <button id="watchAddBtn" class="btn-primary" data-i18n-title="watchAdd" data-i18n-aria="watchAdd">
                            <svg class="icon"><use href="#i-plus"></use></svg>
                        </button>
                    </div>
                </div>

                <div class="card history-section">
                    <div class="section-header">
                        <h3>
                            <svg class="icon icon-sm"><use href="#i-eye"></use></svg>
                            <span data-i18n="watchTitle">Watched</span>
                        </h3>
                    </div>
                    <div id="watchList" class="watch-list"></div>
                </div>
            </section>
        </div>

        <div class="footer">
            <div id="status" class="status">
                <svg class="icon icon-xs" id="statusIcon"><use href="#i-dot"></use></svg>
                <span id="statusText">Ready</span>
            </div>
        </div>
    </div>

    <div id="notifications" class="notifications" role="status" aria-live="polite"></div>

    <script type="module" src="popup.js"></script>
</body>
</html>
