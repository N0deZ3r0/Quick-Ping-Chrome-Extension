name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Свежий пуш в ту же ветку отменяет предыдущий прогон, чтобы очередь
# не копилась на ветке, в которую коммитят часто.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate sources
    runs-on: ubuntu-latest

    steps:
      # checkout v7.0.1 и setup-node v7.0.0 объявляют `using: node24`: на v4
      # раннер печатал предупреждение о снятом с поддержки Node 20 и всё равно
      # запускал их на Node 24. Node 20 в матрице тоже заменён на 24 — он вышел
      # из поддержки, а тестам (node --test, без зависимостей) это безразлично.
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: JavaScript syntax
        run: node .github/scripts/validate.mjs js

      - name: JSON syntax
        run: node .github/scripts/validate.mjs json

      - name: Extension manifest
        run: node .github/scripts/validate.mjs manifest

      - name: Page assets
        run: node .github/scripts/validate.mjs html

      - name: Translations
        run: node .github/scripts/validate.mjs i18n

      - name: Background watch logic
        run: npm test
