name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Свежий пуш в ту же ветку отменяет предыдущий прогон, чтобы очередь
# не копилась на ветке, в которую коммитят часто.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate sources
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax
        run: node .github/scripts/validate.mjs js

      - name: JSON syntax
        run: node .github/scripts/validate.mjs json

      - name: Extension manifest
        run: node .github/scripts/validate.mjs manifest

      - name: Page assets
        run: node .github/scripts/validate.mjs html

      - name: Translations
        run: node .github/scripts/validate.mjs i18n
